[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archiver-mgmt-operations"
dynamic = ["version"]
description = 'Tool for doing archiver mgmt operations'
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = []
authors = [
  { name = "skybrewer", email = "sky.brewer@ess.eu" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "click>=8",
  "rich>=13",
  "py-epicsarchiver>=0.16"
]

[project.urls]
Documentation = "https://github.com/skybrewer/archiver-mgmt-operations#readme"
Issues = "https://github.com/skybrewer/archiver-mgmt-operations/issues"
Source = "https://github.com/skybrewer/archiver-mgmt-operations"

[project.scripts]
archiver_mgmt = "archiver_mgmt_operations.command:cli"

[tool.hatch.version]
path = "src/archiver_mgmt_operations/__about__.py"

[tool.hatch.envs.default.env-vars]
UV_EXTRA_INDEX_URL = "https://artifactory.esss.lu.se/artifactory/api/pypi/pypi-virtual/simple"
PIP_EXTRA_INDEX_URL = "https://artifactory.esss.lu.se/artifactory/api/pypi/pypi-virtual/simple"

[tool.hatch.envs.hatch-test.env-vars]
UV_EXTRA_INDEX_URL = "https://artifactory.esss.lu.se/artifactory/api/pypi/pypi-virtual/simple"
PIP_EXTRA_INDEX_URL = "https://artifactory.esss.lu.se/artifactory/api/pypi/pypi-virtual/simple"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
  "pytest",
  "pytest-mock"
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/archiver_mgmt_operations tests}"

[tool.hatch.envs.hatch-test]
extra-dependencies = [
  "responses",
  "pytest-mock",
]

[tool.coverage.run]
source_pkgs = ["archiver_mgmt_operations", "tests"]
branch = true
parallel = true
omit = [
  "src/archiver_mgmt_operations/__about__.py",
]

[tool.coverage.paths]
archiver_mgmt_operations = ["src/archiver_mgmt_operations", "*/archiver-mgmt-operations/src/archiver_mgmt_operations"]
tests = ["tests", "*/archiver-mgmt-operations/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 120
preview = true

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 80

[tool.ruff.lint]
select = ["ALL"
]
ignore = [
  "ANN204", "ANN401", "COM812", "CPY001", "D412", "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*" = [
  "PLC1901",
  "PLR2004",
  "PLR6301",
  "S",
  "TID252",
]
"tests/**/*" = ["PLR2004", "S101", "TID252", "D", "SLF001", "INP001", "PLC2701"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["py_epicsarchiver"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.pydocstyle]
# Use Google-style docstrings.
convention = "google"
