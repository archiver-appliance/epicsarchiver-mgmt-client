[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archiver-mgmt-operations"
dynamic = ["version"]
description = 'Tool for doing archiver mgmt operations'
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "skybrewer", email = "sky.brewer@ess.eu" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "click>=8",
  "rich>=13",
  "py-epicsarchiver>=0.16"
]

[project.urls]
Documentation = "https://github.com/skybrewer/archiver-mgmt-operations#readme"
Issues = "https://github.com/skybrewer/archiver-mgmt-operations/issues"
Source = "https://github.com/skybrewer/archiver-mgmt-operations"

[tool.hatch.version]
path = "src/archiver_mgmt_operations/__about__.py"

[tool.hatch.envs.default.env-vars]
UV_EXTRA_INDEX_URL = "https://artifactory.esss.lu.se/artifactory/api/pypi/pypi-virtual/simple"
PIP_EXTRA_INDEX_URL = "https://artifactory.esss.lu.se/artifactory/api/pypi/pypi-virtual/simple"

[tool.hatch.envs.hatch-test.env-vars]
UV_EXTRA_INDEX_URL = "https://artifactory.esss.lu.se/artifactory/api/pypi/pypi-virtual/simple"
PIP_EXTRA_INDEX_URL = "https://artifactory.esss.lu.se/artifactory/api/pypi/pypi-virtual/simple"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/archiver_mgmt_operations tests}"

[tool.hatch.envs.hatch-test]
extra-dependencies = [
  "responses"
]

[tool.coverage.run]
source_pkgs = ["archiver_mgmt_operations", "tests"]
branch = true
parallel = true
omit = [
  "src/archiver_mgmt_operations/__about__.py",
]

[tool.coverage.paths]
archiver_mgmt_operations = ["src/archiver_mgmt_operations", "*/archiver-mgmt-operations/src/archiver_mgmt_operations"]
tests = ["tests", "*/archiver-mgmt-operations/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
